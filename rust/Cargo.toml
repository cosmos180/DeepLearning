# 工作空间配置
[workspace]
# resolver 是用于解析依赖的算法版本
resolver = "3"
members = [ "backend","frontend"]

# 工作空间共享依赖
[workspace.dependencies]
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }


# 禁止使用 unsafe 代码
[workspace.lints.rust]
unsafe_code = "forbid"

# 启用 Clippy 的 pedantic 警告组
[workspace.lints.clippy]
pedantic = "warn"
