<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision-0 Enhanced — AI 影视制片厂</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
    }

    .glass {
      background: rgba(18, 18, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glow-purple {
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }

    .glow-blue {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    }

    .agent-card {
      transition: all 0.3s ease;
    }

    .agent-card.active {
      border-color: rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
    }

    .agent-card.completed {
      border-color: rgba(34, 197, 94, 0.5);
    }

    .agent-card.reflecting {
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .log-entry {
      /* 移除动画以提升滚动性能 */
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pulse-dot {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .step-connector {
      background: linear-gradient(to right, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
    }

    .artifact-card:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-2px);
    }

    .artifact-card {
      transition: all 0.2s ease;
    }

    .modal-overlay {
      background: rgba(0, 0, 0, 0.85);
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .markdown-content h1 {
      font-size: 1.4em;
      font-weight: 700;
      margin: 1em 0 0.5em;
      color: #c4b5fd;
    }

    .markdown-content h2 {
      font-size: 1.2em;
      font-weight: 600;
      margin: 0.8em 0 0.4em;
      color: #a78bfa;
    }

    .markdown-content h3 {
      font-size: 1.05em;
      font-weight: 600;
      margin: 0.6em 0 0.3em;
      color: #8b5cf6;
    }

    .markdown-content p {
      margin: 0.4em 0;
      line-height: 1.7;
    }

    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8em 0;
      font-size: 0.85em;
    }

    .markdown-content th {
      background: rgba(139, 92, 246, 0.2);
      padding: 6px 10px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .markdown-content td {
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .markdown-content tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    .markdown-content strong {
      color: #c4b5fd;
    }

    .markdown-content code {
      background: rgba(139, 92, 246, 0.15);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .markdown-content blockquote {
      border-left: 3px solid #8b5cf6;
      padding-left: 12px;
      color: #94a3b8;
      margin: 0.5em 0;
    }

    .markdown-content ul,
    .markdown-content ol {
      padding-left: 1.5em;
      margin: 0.4em 0;
    }

    .markdown-content li {
      margin: 0.2em 0;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.4);
      border-radius: 3px;
    }

    /* 优化滚动性能 */
    .overflow-y-auto {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      will-change: transform;
    }

    /* 减少动画对滚动的影响 */
    .pulse-dot {
      will-change: opacity;
    }

    /* 流行元素标签样式 */
    .element-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      transition: all 0.2s ease;
      user-select: none;
    }

    .element-tag:hover {
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.1);
    }

    .element-tag.selected {
      border-color: rgba(139, 92, 246, 0.6);
      background: rgba(139, 92, 246, 0.25);
      color: #e9d5ff;
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.15);
    }

    .element-category {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 500;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Header -->
  <header class="glass border-b border-white/10 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center text-sm font-bold">
          V0</div>
        <div>
          <h1 class="font-semibold text-white">Vision-0 Enhanced</h1>
          <p class="text-xs text-slate-400">AI 影视制片厂 · 多智能体系统</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs glass">
          <div class="w-2 h-2 rounded-full bg-slate-500" id="status-dot"></div>
          <span id="status-text">就绪</span>
        </div>
        <button onclick="resetProject()"
          class="px-3 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-white/10 transition-all">重置</button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <!-- 入口卡片面板 -->

        <div

        </div>
        <div

          <div class="text-4xl mb-3">✍️</div>
          <h3 class="font-semibold text-white">创作</h3>
          <p class="text-xs text-slate-400 mt-1">故事圣经</p>
          <p class="text-[10px] text-slate-600 mt-2">进入创作工作台</p>
        </div>
        <div
          class="entry-card glass rounded-2xl p-6 cursor-pointer hover:border-blue-500/40 border border-transparent transition-all"

          <h3 class="font-semibold text-white">编剧</h3>
          <p class="text-xs text-slate-400 mt-1">撰写剧本</p>
          <p class="text-[10px] text-slate-600 mt-2">跳过创作步骤</p>
        </div>
        <div

          <h3 class="font-semibold text-white">剧本评审</h3>
          <p class="text-xs text-slate-400 mt-1">临床诊断</p>
          <p class="text-[10px] text-slate-600 mt-2">进入评审工作台</p>
        </div>
        <div
          class="entry-card glass rounded-2xl p-6 cursor-pointer hover:border-pink-500/40 border border-transparent transition-all"
          onclick="openEntryModal('art_director')">
          <div class="text-4xl mb-3">🎨</div>
          <h3 class="font-semibold text-white">艺术总监</h3>
          <p class="text-xs text-slate-400 mt-1">视觉风格</p>
          <p class="text-[10px] text-slate-600 mt-2">跳过创作步骤</p>
        </div>
        <div
          class="entry-card glass rounded-2xl p-6 cursor-pointer hover:border-amber-500/40 border border-transparent transition-all"

          <p class="text-[10px] text-slate-600 mt-2">仅执行导演步骤</p>

      </div>

      <!-- 二级菜单：可观测性追踪 + 高级设置 -->
      <div class="mt-6 pt-4 border-t border-white/10">
        <details class="text-sm group">
          <summary

            <span>📋</span>
            <span>高级选项</span>
            <svg class="w-4 h-4 transform group-open:rotate-180 transition-transform" fill="none" stroke="currentColor"

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </summary>
          <div class="mt-4 space-y-4">
            <button onclick="loadAndShowTraces()"

              📊 可观测性追踪
            </button>
            <!-- AI 模型高级配置 -->
            <div class="p-4 bg-white/5 border border-white/10 rounded-xl" id="model-config-panel">
              <h4 class="text-xs text-slate-400 mb-3 font-medium">模型配置（全局默认）</h4>
              <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                <div>
                  <label class="block text-xs text-slate-500 mb-1">✍️ 原著作者</label>
                  <input type="text" id="model-creator" placeholder="默认"
                    class="w-full bg-black/30 border border-white/5 text-slate-300 rounded px-2 py-1.5 focus:border-purple-500/50 outline-none text-xs"
                    list="model-suggestions" />
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1">📝 编剧</label>
                  <input type="text" id="model-screenwriter" placeholder="默认"
                    class="w-full bg-black/30 border border-white/5 text-slate-300 rounded px-2 py-1.5 focus:border-purple-500/50 outline-none text-xs"
                    list="model-suggestions" />
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1">🎨 艺术总监</label>
                  <input type="text" id="model-art_director" placeholder="默认"
                    class="w-full bg-black/30 border border-white/5 text-slate-300 rounded px-2 py-1.5 focus:border-purple-500/50 outline-none text-xs"
                    list="model-suggestions" />
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1">🔍 剧本评审</label>
                  <input type="text" id="model-reviewer" placeholder="默认"
                    class="w-full bg-black/30 border border-white/5 text-slate-300 rounded px-2 py-1.5 focus:border-purple-500/50 outline-none text-xs"
                    list="model-suggestions" />
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1">🎬 导演</label>
                  <input type="text" id="model-director" placeholder="默认"

                    list="model-suggestions" />
                </div>
              </div>
              <datalist id="model-suggestions">
                <option value="anthropic/claude-3.5-sonnet"></option>
                <option value="openai/gpt-4o"></option>
                <option value="openai/gpt-4o-mini"></option>
                <option value="meta-llama/llama-3-70b-instruct"></option>
                <option value="google/gemini-2.5-pro"></option>
                <option value="deepseek/deepseek-chat"></option>
              </datalist>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- 工作流进度 -->
    <div id="workflow-panel" class="hidden">
      <h2 class="text-lg font-semibold text-white mb-4">工作流进度</h2>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="agent-cards">

      </div>
    </div>

    <!-- 最新作品记录 -->
    <div id="latest-work-panel" class="hidden">
      <div class="flex items-center justify-between mb-4">

      <div id="latest-work-content" class="glass rounded-2xl p-5">
        <p class="text-xs text-slate-500 text-center py-4">作品完成后将在此展示...</p>
      </div>
    </div>

  </div>

  <!-- 产出物详情 Modal -->
  <div id="artifact-modal" class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between p-5 border-b border-white/10">
        <h3 id="modal-title" class="font-semibold text-white flex items-center gap-3">
          <!-- 标题通过 JS 注入 -->
        </h3>
        <div class="flex items-center gap-4">
          <button id="modal-copy-btn"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition-colors text-xs border border-white/5">
            <span>📋</span>
            <span class="btn-text">复制全文</span>
          </button>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl leading-none">×</button>
        </div>
      </div>
      <div id="modal-content" class="flex-1 overflow-y-auto p-5 markdown-content text-sm text-slate-300"></div>
    </div>
  </div>

  <!-- 入口启动 Modal -->
  <div id="entry-modal" class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between p-5 border-b border-white/10">
        <h3 id="entry-modal-title" class="font-semibold text-white">启动工作流</h3>
        <button onclick="closeEntryModal()" class="text-slate-400 hover:text-white text-xl leading-none">×</button>
      </div>
      <div id="entry-modal-content" class="flex-1 overflow-y-auto p-5">
        <!-- 动态内容 -->
      </div>
      <div class="p-5 border-t border-white/10">
        <button onclick="submitEntryForm()" id="entry-submit-btn"
          class="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-blue-600 text-white font-medium text-sm hover:from-purple-500 hover:to-blue-500 transition-all glow-purple">
          开始执行
        </button>
      </div>
    </div>
  </div>

  <!-- 追踪 Modal -->
  <div id="traces-modal" class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4">
    <div class="glass rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between p-5 border-b border-white/10">
        <h3 class="font-semibold text-white">📊 可观测性追踪</h3>
        <button onclick="closeTracesModal()" class="text-slate-400 hover:text-white text-xl leading-none">×</button>
      </div>
      <div id="traces-modal-content" class="flex-1 overflow-y-auto p-5">
        <p class="text-xs text-slate-500 text-center py-4">加载中...</p>
      </div>
    </div>
  </div>

        fields: [
          { id: 'seed', label: '创意种子', type: 'textarea', required: true, placeholder: '用一句话描述你的故事创意...' },
          { id: 'target_duration', label: '目标时长', type: 'select', required: false, default: '30分钟短片', options: ['5分钟微短剧', '15分钟短片', '30分钟短片', '45分钟剧集试播集', '90分钟电影', '120分钟电影'] },
          { id: 'popular_elements', label: '创作元素（可选）', type: 'tags', required: false },
        ],
        description: '输入创意种子，AI 全自动完成：创作 → 编剧 → 评审 → 导演'
      },
      screenwriter: {
        title: '📝 编剧入口',
        step: 'parallel_dev',
        fields: [
          { id: 'logline', label: 'Logline', type: 'textarea', required: true, placeholder: '一句话故事梗概...' },
          { id: 'character_sheets', label: '角色设定', type: 'textarea', required: true, placeholder: '角色详细设定...' },
          { id: 'beat_sheet', label: '节拍表', type: 'textarea', required: true, placeholder: '故事节拍表...' },
        ],
        description: '跳过创作步骤，从编剧和艺术总监并行开始'
      },
      art_director: {
        title: '🎨 艺术总监入口',
        step: 'parallel_dev',
        fields: [
          { id: 'logline', label: 'Logline', type: 'textarea', required: true, placeholder: '一句话故事梗概...' },
          { id: 'character_sheets', label: '角色设定', type: 'textarea', required: true, placeholder: '角色详细设定...' },
          { id: 'beat_sheet', label: '节拍表', type: 'textarea', required: true, placeholder: '故事节拍表...' },
        ],
        description: '跳过创作步骤，从编剧和艺术总监并行开始'
      },
      director: {
        title: '🎬 导演入口',
        step: 'direction',
        fields: [
          { id: 'script', label: '剧本', type: 'textarea', required: true, placeholder: '完整剧本内容...' },
          { id: 'character_sheets', label: '角色设定', type: 'textarea', required: false, placeholder: '角色详细设定...' },
          { id: 'style_guide', label: '视觉风格圣经', type: 'textarea', required: false, placeholder: '视觉风格指南...' },
        ],
        description: '仅执行导演步骤，生成分镜和视频 Prompt'
      }
    };

    // 打开编辑器页面
    function openEditor(mode) {
      window.location.href = `editor.html?mode=${mode}`;
    }

    function openEntryModal(type) {
      currentEntryType = type;
      const config = ENTRY_CONFIGS[type];
      if (!config) return;

      document.getElementById('entry-modal-title').textContent = config.title;

      let formHtml = `<p class="text-xs text-slate-400 mb-4">${config.description}</p>`;

      config.fields.forEach(field => {
        const requiredMark = field.required ? '<span class="text-purple-400">*</span>' : '';
        const defaultVal = field.default || '';

        if (field.type === 'textarea') {
          formHtml += `
            <div class="mb-4">
              <label class="block text-xs text-slate-400 mb-2">${field.label} ${requiredMark}</label>
              <textarea id="entry-${field.id}" rows="4" placeholder="${field.placeholder || ''}"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500/50 resize-none">${defaultVal}</textarea>
            </div>`;
        } else if (field.type === 'text') {
          formHtml += `
            <div class="mb-4">
              <label class="block text-xs text-slate-400 mb-2">${field.label} ${requiredMark}</label>
              <input type="text" id="entry-${field.id}" value="${defaultVal}" placeholder="${field.placeholder || ''}"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500/50" />
            </div>`;
        } else if (field.type === 'select') {
          formHtml += `
            <div class="mb-4">
              <label class="block text-xs text-slate-400 mb-2">${field.label} ${requiredMark}</label>
              <select id="entry-${field.id}"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500/50" style="background-color: #1a1a2e;">
                ${field.options.map(opt => `<option value="${opt}" ${opt === defaultVal ? 'selected' : ''} style="background-color: #1a1a2e; color: #e2e8f0;">${opt}</option>`).join('')}
              </select>
            </div>`;
        } else if (field.type === 'tags') {
          formHtml += `
            <div class="mb-4">
              <div class="flex items-center justify-between mb-2">
                <label class="block text-xs text-slate-400">${field.label}</label>
                <span id="entry-tags-count" class="text-[10px] text-slate-600">已选 0 项</span>
              </div>
              <div class="bg-white/[0.02] border border-white/10 rounded-xl p-3 max-h-52 overflow-y-auto space-y-3" id="entry-${field.id}-container">
                ${POPULAR_ELEMENTS.map(group => `
                  <div>
                    <div class="element-category">${group.category}</div>
                    <div class="flex flex-wrap gap-1.5">
                      ${group.tags.map(tag => `<span class="element-tag" onclick="toggleElementTag(this)" data-tag="${tag}" data-group="${group.group || 'element'}">${tag}</span>`).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>`;
        }
      });

      // 快速示例（仅创作入口）
      if (type === 'creator') {
        formHtml += `
          <div class="flex flex-wrap gap-2 mt-2">
            <span class="text-xs text-slate-500">快速示例：</span>
            <button type="button" onclick="fillEntryExample(0)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all">失忆机器人</button>
            <button type="button" onclick="fillEntryExample(1)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all">最后的书店</button>
            <button type="button" onclick="fillEntryExample(2)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all">时间快递员</button>
          </div>`;
      }

      document.getElementById('entry-modal-content').innerHTML = formHtml;
      document.getElementById('entry-modal').classList.remove('hidden');
    }

    function closeEntryModal() {
      document.getElementById('entry-modal').classList.add('hidden');
      currentEntryType = null;
    }

    function fillEntryExample(idx) {
      const ex = EXAMPLES[idx];
      const seedInput = document.getElementById('entry-seed');
      if (seedInput) seedInput.value = ex.seed;
      // 清除之前选中的风格标签，选中示例对应的风格
      document.querySelectorAll('.element-tag[data-group="genre"]').forEach(el => {
        el.classList.remove('selected');
      });
      if (ex.style) {
        ex.style.split('+').forEach(s => {
          const tag = document.querySelector(`.element-tag[data-group="genre"][data-tag="${s.trim()}"]`);
          if (tag) tag.classList.add('selected');
        });
      }
      updateTagCount();
    }

    function toggleElementTag(el) {
      el.classList.toggle('selected');
      updateTagCount();
    }

    function updateTagCount() {
      const selected = document.querySelectorAll('.element-tag.selected');
      const countEl = document.getElementById('entry-tags-count');
      if (countEl) countEl.textContent = `已选 ${selected.length} 项`;
    }

    function getSelectedElements() {
      return Array.from(document.querySelectorAll('.element-tag.selected:not([data-group="genre"])')).map(el => el.dataset.tag);
    }

    function getSelectedGenres() {
      return Array.from(document.querySelectorAll('.element-tag.selected[data-group="genre"]')).map(el => el.dataset.tag);
    }

    async function submitEntryForm() {
      const config = ENTRY_CONFIGS[currentEntryType];
      if (!config) return;

      // 收集表单数据
      const formData = {};
      const artifacts = {};
      let hasError = false;

      config.fields.forEach(field => {
        const el = document.getElementById(`entry-${field.id}`);
        const value = el ? el.value.trim() : '';

        if (field.required && !value) {
          el.classList.add('border-red-500/50');
          hasError = true;
        } else if (el) {
          el.classList.remove('border-red-500/50');
        }

        // 区分工作流参数和产出物
        if (['seed', 'target_duration'].includes(field.id)) {
          formData[field.id] = value;
        } else if (field.type === 'tags') {
          // tags 类型单独处理
        } else {
          artifacts[field.id] = value;
        }
      });

      if (hasError) {
        alert('请填写所有必填项！');
        return;
      }

      // 获取全局模型配置
      const agentModels = {};
      ['creator', 'screenwriter', 'art_director', 'reviewer', 'director'].forEach(agent => {
        const modelInput = document.getElementById(`model-${agent}`);
        if (modelInput && modelInput.value.trim()) {
          agentModels[agent] = modelInput.value.trim();
        }
      });

      // 收集选中的流行元素
      const popularElements = getSelectedElements();
      // 存储到 localStorage 供编辑器使用
      localStorage.setItem('popularElements', JSON.stringify(popularElements));

      // 从类型风格标签中生成 style 字符串
      const selectedGenres = getSelectedGenres();
      const styleStr = selectedGenres.length > 0 ? selectedGenres.join('+') : '';

      // 构建请求
      const requestBody = {
        seed: formData.seed || '',
        target_duration: formData.target_duration || '30分钟剧集试播集',
        style: styleStr,
        popular_elements: popularElements,
        agent_models: agentModels,
        start_from_step: config.step,
        artifacts: artifacts
      };

      const btn = document.getElementById('entry-submit-btn');
      btn.disabled = true;
      btn.textContent = '启动中...';

      try {
        const res = await fetch(`${API}/api/project/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.detail || '启动失败');
          btn.disabled = false;
          btn.textContent = '开始执行';
          return;
        }
        closeEntryModal();
        showWorkflowUI();
        connectSSE();
      } catch (e) {
        alert('连接服务器失败，请确认后端已启动');
        btn.disabled = false;
        btn.textContent = '开始执行';
      }
    }

    async function resetProject() {
      if (!confirm('确认重置？所有数据将被清空。')) return;
      if (eventSource) { eventSource.close(); eventSource = null; }
      await fetch(`${API}/api/project/reset`, { method: 'POST' });
      location.reload();
    }

    function showWorkflowUI() {
      document.getElementById('entry-panel').classList.add('hidden');
      document.getElementById('workflow-panel').classList.remove('hidden');
      document.getElementById('latest-work-panel').classList.remove('hidden');
      document.getElementById('log-pulse').style.display = 'block';
      renderAgentCards({});
    }

    function connectSSE() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(`${API}/api/events`);

      eventSource.addEventListener('init', e => handleUpdate(JSON.parse(e.data)));
      eventSource.addEventListener('update', e => handleUpdate(JSON.parse(e.data)));
      eventSource.addEventListener('heartbeat', () => { });
      eventSource.onerror = () => {
        setTimeout(connectSSE, 3000);
      };
    }

    function handleUpdate(data) {
      if (data.workflow) updateStatus(data.workflow);
      if (data.artifacts) {
        currentArtifacts = data.artifacts;
        updateAgentCardsFromLogs(data.logs || []);
        // 如果已完成，渲染最新作品
        if (data.workflow && data.workflow.status === 'completed') {
          renderLatestWork(data.artifacts, data.workflow);
        }
      }
    }

    function updateStatus(workflow) {
      if (!workflow) return;
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const step = workflow.current_step || '';

      const statusMap = {
        running: { color: 'bg-purple-400', text: step || '运行中' },
        completed: { color: 'bg-green-400', text: '制作完成 🎉' },
        failed: { color: 'bg-red-400', text: '执行失败' },
        idle: { color: 'bg-slate-500', text: '就绪' },
      };
      const s = statusMap[workflow.status] || statusMap.idle;
      dot.className = `w-2 h-2 rounded-full ${s.color}`;
      text.textContent = s.text;

      if (workflow.status === 'completed') {
        document.getElementById('log-pulse').style.display = 'none';
      }
    }

    function renderLatestWork(artifacts, workflow) {
      const container = document.getElementById('latest-work-content');
      const entries = Object.entries(artifacts);
      if (entries.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">暂无作品数据</p>';
        return;
      }

      // 显示作品信息摘要
      const seed = workflow.seed || '未知创意';
      const style = workflow.style || '未知风格';
      const duration = workflow.target_duration || '未知时长';

      let html = `
        <div class="mb-4 pb-4 border-b border-white/10">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-purple-400">💡</span>
            <span class="text-sm font-medium text-white">创意种子</span>
          </div>
          <p class="text-xs text-slate-400">${seed}</p>
          <div class="flex gap-4 mt-2 text-xs text-slate-500">
            <span>📁 ${duration}</span>
            <span>🎨 ${style}</span>
          </div>
        </div>
        <div class="mb-4">
          <h4 class="text-sm font-medium text-white mb-3">产出物清单</h4>
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
      `;

      entries.forEach(([type, info]) => {
        const meta = ARTIFACT_LABELS[type] || { label: type, icon: '📄', color: 'slate' };
        const colorMap = {
          purple: 'border-purple-500/30 hover:border-purple-500/60',
          blue: 'border-blue-500/30 hover:border-blue-500/60',
          indigo: 'border-indigo-500/30 hover:border-indigo-500/60',
          violet: 'border-violet-500/30 hover:border-violet-500/60',
          rose: 'border-rose-500/30 hover:border-rose-500/60',
          amber: 'border-amber-500/30 hover:border-amber-500/60',
          green: 'border-green-500/30 hover:border-green-500/60',
          teal: 'border-teal-500/30 hover:border-teal-500/60',
          pink: 'border-pink-500/30 hover:border-pink-500/60',
          slate: 'border-slate-500/30 hover:border-slate-500/60',
        };
        const borderCls = colorMap[meta.color] || colorMap.slate;
        const chars = info.length || 0;

        html += `
          <div class="artifact-card glass rounded-xl p-3 cursor-pointer border ${borderCls}"
              onclick="openArtifact('${type}', '${meta.label}')">
            <div class="text-lg mb-1">${meta.icon}</div>
            <div class="font-medium text-xs text-white mb-1">${meta.label}</div>
            <div class="text-[10px] text-slate-500">${chars.toLocaleString()} 字符</div>
          </div>`;
      });

      html += `
          </div>
        </div>
        <div class="text-xs text-slate-500 text-center">
          点击卡片查看详细内容
        </div>
      `;

      container.innerHTML = html;
    }

    function renderAgentCards(agentStatuses) {
      const container = document.getElementById('agent-cards');
      container.innerHTML = AGENTS.map(a => {
        const st = agentStatuses[a.id] || 'idle';
        let cls = 'idle', statusText = '等待中', dotCls = 'bg-slate-600';
        if (st === 'thinking') { cls = 'active'; statusText = '工作中...'; dotCls = 'bg-purple-400 pulse-dot'; }
        else if (st === 'reflecting') { cls = 'reflecting'; statusText = '反思中...'; dotCls = 'bg-yellow-400 pulse-dot'; }
        else if (st === 'completed') { cls = 'completed'; statusText = '已完成'; dotCls = 'bg-green-400'; }
        else if (st === 'failed') { cls = ''; statusText = '失败'; dotCls = 'bg-red-400'; }

        const isClickable = ['creator', 'reviewer', 'screenwriter'].includes(a.id);
        const clickableCls = isClickable ? 'cursor-pointer hover:border-purple-500/40 hover:-translate-y-1 transition-all' : '';
        const onclickAttr = isClickable ? `onclick="openEditor('${a.id === 'screenwriter' ? 'creator' : a.id}')"` : '';

        return `<div class="agent-card glass rounded-xl p-4 ${cls} ${clickableCls}" ${onclickAttr}>
      <div class="flex items-center justify-between mb-2">
        <span class="text-xl">${a.icon}</span>
        <div class="w-2 h-2 rounded-full ${dotCls}"></div>
      </div>
      <div class="font-medium text-sm text-white">${a.name}</div>
      <div class="text-xs text-slate-400 mt-1">${a.desc}</div>
      <div class="text-xs text-slate-500 mt-2 flex justify-between items-center">
        <span>${statusText}</span>
        ${isClickable && st === 'completed' ? '<span class="text-[10px] text-purple-400">点击进入工作台</span>' : ''}
      </div>
    </div>`;
      }).join('');
    }

    function updateAgentCardsFromLogs(logs) {
      const agentStatuses = {};
      const agentNameMap = {
        '原著作者': 'creator', '编剧': 'screenwriter',
        '艺术总监': 'art_director', '剧本评审': 'reviewer', '导演': 'director',
      };
      logs.forEach(log => {
        const id = agentNameMap[log.agent];
        if (id) agentStatuses[id] = log.status;
      });
      renderAgentCards(agentStatuses);
    }

    async function openArtifact(type, label) {
      document.getElementById('modal-title').textContent = `${ARTIFACT_LABELS[type]?.icon || '📄'} ${label}`;
      document.getElementById('modal-content').innerHTML = '<p class="text-slate-500 text-center py-8">加载中...</p>';
      document.getElementById('artifact-modal').classList.remove('hidden');

      try {
        const res = await fetch(`${API}/api/artifact/${type}`);
        const data = await res.json();
        const html = marked.parse(data.content || '（内容为空）');
        document.getElementById('modal-content').innerHTML = html;

        // 绑定复制按钮事件
        const copyBtn = document.getElementById('modal-copy-btn');
        copyBtn.onclick = () => copyArtifact(type, copyBtn);
      } catch (e) {
        document.getElementById('modal-content').innerHTML = '<p class="text-red-400 text-center py-8">加载失败</p>';
      }
    }

    async function copyArtifact(type, btn) {
      const textSpan = btn.querySelector('.btn-text') || btn;
      const original = textSpan.textContent;
      textSpan.textContent = '复制成功';
      const iconSpan = btn.querySelector('span:first-child');
      if (iconSpan) iconSpan.textContent = '✅';

      try {
        const res = await fetch(`${API}/api/artifact/${type}`);
        const data = await res.json();
        await navigator.clipboard.writeText(data.content || '');
        setTimeout(() => {
          textSpan.textContent = original;
          if (iconSpan) iconSpan.textContent = '📋';
        }, 1500);
      } catch (e) {
        textSpan.textContent = '复制失败';
        if (iconSpan) iconSpan.textContent = '❌';
        setTimeout(() => {
          textSpan.textContent = original;
          if (iconSpan) iconSpan.textContent = '📋';
        }, 1500);
      }
    }

    function closeModal() {
      document.getElementById('artifact-modal').classList.add('hidden');
    }

    document.getElementById('artifact-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('artifact-modal')) closeModal();
    });

    async function loadAndShowTraces() {
      document.getElementById('traces-modal').classList.remove('hidden');
      const container = document.getElementById('traces-modal-content');
      container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">加载中...</p>';

      try {
        const res = await fetch(`${API}/api/traces`);
        const data = await res.json();

        if (!data.traces || data.traces.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">暂无追踪数据</p>';
          return;
        }

        const eventColors = {
          llm_call_round_0: 'text-blue-400', llm_response_round_0: 'text-green-400',
          reflection: 'text-yellow-400', llm_call_round_1: 'text-blue-300',
          llm_response_round_1: 'text-green-300',
        };

        container.innerHTML = data.traces.map(t => {
          const color = eventColors[t.event] || 'text-slate-400';
          const time = t.time ? new Date(t.time).toLocaleTimeString('zh-CN') : '';
          return `<div class="flex gap-3 text-xs py-1.5 border-b border-white/5">
        <span class="text-slate-600 flex-shrink-0 w-16">${time}</span>
        <span class="font-medium text-slate-300 flex-shrink-0 w-20 truncate">${t.agent}</span>
        <span class="${color} flex-shrink-0 w-32 truncate">${t.event}</span>
        ${t.tokens ? `<span class="text-slate-500 flex-shrink-0">${t.tokens}tok</span>` : '<span class="w-12"></span>'}
        ${t.duration_ms ? `<span class="text-slate-600 flex-shrink-0">${t.duration_ms}ms</span>` : ''}
        <span class="text-slate-600 truncate flex-1">${t.content?.substring(0, 80) || ''}</span>
      </div>`;
        }).join('');
      } catch (e) {
        container.innerHTML = '<p class="text-red-400 text-center py-4">加载失败</p>';
      }
    }

    function closeTracesModal() {
      document.getElementById('traces-modal').classList.add('hidden');
    }

    // 点击外部关闭模态框
    // 入口 modal 仅通过关闭按钮关闭，不响应点击外部

    document.getElementById('traces-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('traces-modal')) closeTracesModal();
    });

    // 页面加载时检查状态
    window.addEventListener('load', async () => {
      try {
        const res = await fetch(`${API}/api/state`);
        const data = await res.json();
        if (data.workflow && ['running', 'completed'].includes(data.workflow.status)) {
          showWorkflowUI();
          handleUpdate(data);
          if (data.workflow.status === 'running') connectSSE();
        }
      } catch (e) { }
    });
  </script>
</body>

</html>
