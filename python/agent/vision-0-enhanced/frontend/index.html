<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision-0 Enhanced — AI 影视制片厂</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
    }

    .glass {
      background: rgba(18, 18, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glow-purple {
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }

    .glow-blue {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    }

    .agent-card {
      transition: all 0.3s ease;
    }

    .agent-card.active {
      border-color: rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
    }

    .agent-card.completed {
      border-color: rgba(34, 197, 94, 0.5);
    }

    .agent-card.reflecting {
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .log-entry {
      /* 移除动画以提升滚动性能 */
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pulse-dot {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .step-connector {
      background: linear-gradient(to right, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
    }

    .artifact-card:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-2px);
    }

    .artifact-card {
      transition: all 0.2s ease;
    }

    .modal-overlay {
      background: rgba(0, 0, 0, 0.85);
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .markdown-content h1 {
      font-size: 1.4em;
      font-weight: 700;
      margin: 1em 0 0.5em;
      color: #c4b5fd;
    }

    .markdown-content h2 {
      font-size: 1.2em;
      font-weight: 600;
      margin: 0.8em 0 0.4em;
      color: #a78bfa;
    }

    .markdown-content h3 {
      font-size: 1.05em;
      font-weight: 600;
      margin: 0.6em 0 0.3em;
      color: #8b5cf6;
    }

    .markdown-content p {
      margin: 0.4em 0;
      line-height: 1.7;
    }

    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8em 0;
      font-size: 0.85em;
    }

    .markdown-content th {
      background: rgba(139, 92, 246, 0.2);
      padding: 6px 10px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .markdown-content td {
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .markdown-content tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    .markdown-content strong {
      color: #c4b5fd;
    }

    .markdown-content code {
      background: rgba(139, 92, 246, 0.15);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .markdown-content blockquote {
      border-left: 3px solid #8b5cf6;
      padding-left: 12px;
      color: #94a3b8;
      margin: 0.5em 0;
    }

    .markdown-content ul,
    .markdown-content ol {
      padding-left: 1.5em;
      margin: 0.4em 0;
    }

    .markdown-content li {
      margin: 0.2em 0;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.4);
      border-radius: 3px;
    }

    /* 优化滚动性能 */
    .overflow-y-auto {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      will-change: transform;
    }

    /* 减少动画对滚动的影响 */
    .pulse-dot {
      will-change: opacity;
    }

    /* 流行元素标签样式 */
    .element-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      transition: all 0.2s ease;
      user-select: none;
    }

    .element-tag:hover {
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.1);
    }

    .element-tag.selected {
      border-color: rgba(139, 92, 246, 0.6);
      background: rgba(139, 92, 246, 0.25);
      color: #e9d5ff;
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.15);
    }

    .element-category {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 500;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Header -->
  <header class="glass border-b border-white/10 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div

          V0</div>
        <div>
          <h1 class="font-semibold text-white">Vision-0 Enhanced</h1>
          <p class="text-xs text-slate-400">AI 影视制片厂 · 多智能体系统</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs glass"

  <div class="max-w-7xl mx-auto px-6 py-8 space-y-8 relative">

    </div>

          });

            select.value = savedModel;

    async function submitEntryForm() {
      const config = ENTRY_CONFIGS[currentEntryType];
      if (!config) return;

      // 收集表单数据
      const formData = {};
      const artifacts = {};
      let hasError = false;

      config.fields.forEach(field => {
        const el = document.getElementById(`entry-${field.id}`);
        const value = el ? el.value.trim() : '';

        if (field.required && !value) {
          el.classList.add('border-red-500/50');
          hasError = true;
        } else if (el) {
          el.classList.remove('border-red-500/50');
        }

        // 区分工作流参数和产出物
        if (['seed', 'target_duration'].includes(field.id)) {
          formData[field.id] = value;
        } else if (field.type === 'tags') {
          // tags 类型单独处理
        } else {
          artifacts[field.id] = value;
        }
      });

      if (hasError) {
        alert('请填写所有必填项！');
        return;
      }

      // 获取全局模型配置
      const agentModels = {};
      ['creator', 'screenwriter', 'reviewer', 'art-director', 'director'].forEach(agent => {
        const modelInput = document.getElementById(`entry-model-${agent}`);
        if (modelInput && modelInput.value.trim()) {
          // 由于配置文件的键使用了下划线例如 art_director，需要转换
          const key = agent.replace('-', '_');
          agentModels[key] = modelInput.value.trim();
          // 保存用户的模型选择到 LocalStorage
          localStorage.setItem(`vo_model_${agent}`, modelInput.value.trim());
        } else {
          // 清除保存的选择
          localStorage.removeItem(`vo_model_${agent}`);
        }
      });

      // 组装额外参数收集选中的流行元素
      const popularElements = getSelectedElements();
      // 存储到 localStorage 供编辑器使用
      localStorage.setItem('popularElements', JSON.stringify(popularElements));

      // 从类型风格标签中生成 style 字符串
      const selectedGenres = getSelectedGenres();
      const styleStr = selectedGenres.length > 0 ? selectedGenres.join('+') : '';

      // 构建请求
      const requestBody = {
        seed: formData.seed || '',
        target_duration: formData.target_duration || '30分钟剧集试播集',
        style: styleStr,
        popular_elements: popularElements,
        agent_models: agentModels,
        start_from_step: config.step,
        artifacts: artifacts
      };

      const btn = document.getElementById('entry-submit-btn');
      btn.disabled = true;
      btn.textContent = '启动中...';

      try {
        const res = await fetch(`${API}/api/project/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.detail || '启动失败');
          btn.disabled = false;
          btn.textContent = '开始执行';
          return;
        }

        const resData = await res.json();
        closeEntryModal();
        // showWorkflowUI 用悬浮条展示
        const currentRunningProjectId = resData.project_id;
        showWorkflowUI(currentRunningProjectId);
        await fetchAndRenderProjects(); // 刷新项目列表
        connectSSE(currentRunningProjectId);
      } catch (e) {
        alert('连接服务器失败，请确认后端已启动');
        btn.disabled = false;
        btn.textContent = '开始执行';
      }
    }

    async function resetProject() {
      // no-op 或移除
    }

    function showWorkflowUI(projectId) {
      document.getElementById('workflow-panel').classList.remove('hidden');
      document.getElementById('log-pulse').style.display = 'block';
      // Initialize simplified agent cards layout
      createAgentCards();
      updateAgentCards({});
    }

    function connectSSE(projectId = '') {
      if (eventSource) eventSource.close();
      const url = projectId ? `${API}/api/events?project_id=${projectId}` : `${API}/api/events`;
      eventSource = new EventSource(url);

      eventSource.addEventListener('init', e => handleUpdate(JSON.parse(e.data), projectId));
      eventSource.addEventListener('update', e => handleUpdate(JSON.parse(e.data), projectId));
      eventSource.addEventListener('stream', e => handleStream(JSON.parse(e.data)));
      eventSource.addEventListener('heartbeat', () => { });
      eventSource.onerror = () => {
        setTimeout(() => connectSSE(projectId), 3000);
      };
    }

    function handleUpdate(data, projectId) {
      if (data.workflow) updateStatus(data.workflow, projectId);
      if (data.artifacts) {
        currentArtifacts = data.artifacts;
        updateAgentCardsFromLogs(data.logs || [], projectId);
        // 如果状态刷新了，后台更新 Dashboard List
        if (data.workflow && (data.workflow.status === 'completed' || data.workflow.status === 'failed')) {
          fetchAndRenderProjects();
        }
      }
    }

    function updateStatus(workflow, projectId) {
      if (!workflow) return;
      const step = workflow.current_step || '';

      // Update DOM for the given project in the grid if exists
      const idPrefix = projectId || workflow.project_id;
      if (idPrefix) {
        const statusEl = document.getElementById(`status-text-${idPrefix}`);
        const dotEl = document.getElementById(`status-dot-${idPrefix}`);
        if (statusEl && dotEl) {
          const statusMap = {
            running: { color: 'bg-purple-400', text: step || '运行中' },
            completed: { color: 'bg-green-400', text: '已完成' },
            failed: { color: 'bg-red-400', text: '执行失败' },
            idle: { color: 'bg-slate-500', text: '就绪' },
          };
          const s = statusMap[workflow.status] || statusMap.idle;
          statusEl.textContent = s.text;
          dotEl.className = `w-1.5 h-1.5 rounded-full ${s.color}`;
        }
      }

      if (workflow.status === 'completed') {
        document.getElementById('log-pulse').style.display = 'none';
        setTimeout(() => {
          document.getElementById('workflow-panel').classList.add('hidden');
        }, 5000);
      }
    }

    function createAgentCards() {
      const container = document.getElementById('agent-cards');
      if (!container.innerHTML.trim()) {
        container.innerHTML = AGENTS.map(a => {
          return `<div id="agent-card-${a.id}" class="bg-black/20 rounded-lg p-2.5 flex flex-col transition-all border border-white/5 idle">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="text-base">${a.icon}</span>
                <div>
                  <div class="font-medium text-xs text-white">${a.name}</div>
                  <div id="agent-status-text-${a.id}" class="text-[10px] text-slate-400 mt-0.5">等待中</div>
                </div>
              </div>
              <div id="agent-dot-${a.id}" class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
            </div>
            <div id="stream-${a.id}" class="hidden mt-2 p-2 bg-slate-900/50 rounded border border-white/5 text-[10px] text-green-400 font-mono whitespace-pre-wrap max-h-40 overflow-y-auto break-all tracking-wide shadow-inner shadow-black/50"></div>
          </div>`;
        }).join('');
      }
    }

    function updateAgentCards(agentStatuses) {
      AGENTS.forEach(a => {
        const st = agentStatuses[a.id] || 'idle';
        const cardEl = document.getElementById(`agent-card-${a.id}`);
        const textEl = document.getElementById(`agent-status-text-${a.id}`);
        const dotEl = document.getElementById(`agent-dot-${a.id}`);
        const streamEl = document.getElementById(`stream-${a.id}`);

        if (!cardEl || !textEl || !dotEl) return;

        cardEl.className = `bg-black/20 rounded-lg p-2.5 flex flex-col transition-all border border-white/5`;

        let statusText = '等待中', dotCls = 'bg-slate-600', cardCls = 'idle';
        if (st === 'thinking') { cardCls = 'active border-purple-500/50'; statusText = '工作中...'; dotCls = 'bg-purple-400 pulse-dot'; }
        else if (st === 'reflecting') { cardCls = 'reflecting border-yellow-500/50'; statusText = '反思中...'; dotCls = 'bg-yellow-400 pulse-dot'; }
        else if (st === 'completed') { cardCls = 'completed border-green-500/50'; statusText = '已完成'; dotCls = 'bg-green-400'; }
        else if (st === 'failed') { cardCls = 'border-red-500/50'; statusText = '失败'; dotCls = 'bg-red-400'; }

        if (cardCls) cardEl.classList.add(...cardCls.split(' '));
        textEl.textContent = statusText;
        dotEl.className = `w-1.5 h-1.5 rounded-full ${dotCls}`;

        if (st === 'idle' || st === 'failed') {
          if (streamEl) {
            streamEl.classList.add('hidden');
            streamEl.textContent = '';
          }
          if (_streamBuffers) _streamBuffers[a.id] = '';
        } else if (st === 'completed') {
          if (streamEl) {
            streamEl.classList.add('opacity-50'); // Dim it when done
          }
        }
      });
    }

    const _streamBuffers = {};
    const agentNameMap = {
      '原著作者': 'creator', '编剧': 'screenwriter',
      '艺术总监': 'art_director', '剧本评审': 'reviewer', '导演': 'director',
    };

    function handleStream(data) {
      if (!data || !data.agent || !data.chunk) return;
      const agentId = agentNameMap[data.agent];
      if (!agentId) return;

      const streamEl = document.getElementById(`stream-${agentId}`);
      if (streamEl) {
        streamEl.classList.remove('hidden');
        streamEl.classList.remove('opacity-50');
        if (!_streamBuffers[agentId]) _streamBuffers[agentId] = "";
        _streamBuffers[agentId] += data.chunk;

        streamEl.textContent = _streamBuffers[agentId];
        streamEl.scrollTop = streamEl.scrollHeight;
      }
    }

    function updateAgentCardsFromLogs(logs, projectId) {
      if (!logs) return;
      const agentStatuses = {};
      logs.forEach(log => {
        const id = agentNameMap[log.agent];
        if (id) agentStatuses[id] = log.status;
      });
      createAgentCards(); // Ensure DOM is ready safely
      updateAgentCards(agentStatuses);
    }

    async function fetchAndRenderProjects() {
      try {
        const res = await fetch(`${API}/api/projects`);
        const data = await res.json();
        const projects = data.projects || [];

        document.getElementById('projects-count').textContent = `(${projects.length})`;

        const grid = document.getElementById('projects-grid');
        if (projects.length === 0) {
          grid.innerHTML = '<div class="col-span-full py-16 flex flex-col items-center justify-center text-center"><div class="text-4xl mb-4 opacity-50">📁</div><h3 class="text-slate-300 font-medium mb-1">还没有任何作品</h3><p class="text-xs text-slate-500 max-w-sm">点击右上角的"+ 启动新项目"按钮，开始你的AI影视创作之旅吧。</p></div>';
          return;
        }

        grid.innerHTML = projects.map(p => {
          const isRunning = p.status === 'running';
          const dotCls = isRunning ? 'bg-purple-400 pulse-dot' :
            (p.status === 'completed' ? 'bg-green-400' :
              (p.status === 'failed' ? 'bg-red-400' : 'bg-slate-500'));
          const statusText = isRunning ? (p.current_step || '运行中') :
            (p.status === 'completed' ? '已完成' :
              (p.status === 'failed' ? '失败' : '未知'));

          const dateStr = p.updated_at ? new Date(p.updated_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '刚刚';

          return `
            <div class="project-card group relative bg-[#151522] rounded-2xl overflow-hidden cursor-pointer hover:-translate-y-1 transition-all duration-300 border border-white/5 hover:border-purple-500/30 hover:shadow-[0_0_20px_rgba(139,92,246,0.15)] flex flex-col" data-project-id="${p.project_id}">
              <div class="h-32 bg-gradient-to-br from-purple-900/20 to-blue-900/10 relative p-5 flex flex-col justify-between overflow-hidden">
                <div class="absolute -right-6 -top-6 text-6xl opacity-[0.03] group-hover:scale-110 transition-transform">🎬</div>
                <!-- Top row: 左侧时长标签，右侧状态和删除按钮 -->
                <div class="flex items-center justify-between z-10">
                  <span class="text-[10px] px-2 py-1 rounded-full bg-black/40 text-slate-300 border border-white/10 backdrop-blur-sm shadow-sm">${p.target_duration || '默认时长'}</span>
                  <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-black/40 text-[10px] text-slate-300 border border-white/10 backdrop-blur-sm">
                      <div id="status-dot-${p.project_id}" class="w-1.5 h-1.5 rounded-full ${dotCls}"></div>
                      <span id="status-text-${p.project_id}">${statusText}</span>
                    </div>
                    <button type="button" class="delete-btn text-slate-400 hover:text-red-400 transition-all p-1 bg-black/40 hover:bg-black/60 rounded border border-white/10 backdrop-blur-sm" title="删除项目" data-delete-id="${p.project_id}">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                  </div>
                </div>
                <h3 class="font-medium text-white text-[15px] leading-tight mt-auto z-10 w-[95%] truncate">${p.title || p.seed || '未命名项目'}</h3>
              </div>
              ${p.status === 'failed' && p.error_msg ? `
                <div class="px-4 py-2 bg-red-500/10 border-b border-red-500/10 text-[11px] text-red-400" title="${p.error_msg}">
                  <div class="flex items-start gap-1.5">
                    <span class="mt-0.5">⚠️</span>
                    <span class="line-clamp-2 opacity-90">${p.error_msg}</span>
                  </div>
                </div>
              ` : ''}
              <div class="p-4 flex flex-col gap-3 flex-1">
                <div class="flex items-start gap-2 text-xs text-slate-400">
                  <span class="opacity-60 mt-0.5">📖</span>
                  <div class="line-clamp-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; line-height: 1.4;">${p.summary || p.seed || '暂无简介...'}</div>
                </div>
                <div class="flex items-center gap-2 text-xs text-slate-400 truncate mt-auto">
                  <span class="opacity-60">🎨</span>
                  <span class="truncate">${p.style || '默认风格'}</span>
                </div>
                <div class="flex items-center justify-between pt-2 border-t border-white/[0.03]">
                   <span class="text-[10px] text-slate-500">${dateStr}</span>
                   <span class="text-xs text-purple-400 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">进入工作台 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
                </div>
              </div>
            </div>
           `;
        }).join('');
      } catch (e) {
        console.error("加载项目列表失败: ", e);
      }
    }

    async function deleteProject(projectId) {
      const confirmed = confirm("确定要删除此项目的所有数据吗？这个操作无法撤销。");
      if (!confirmed) {
        return;
      }

      try {
        const res = await fetch(`${API}/api/project/${projectId}`, {
          method: 'DELETE'
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        const data = await res.json();
        if (data.status === 'success') {
          // 删除成功后刷新列表
          await fetchAndRenderProjects();
        } else {
          alert('删除失败: ' + (data.message || '未知错误'));
        }
      } catch (e) {
        console.error("删除项目失败", e);
        alert('删除请求失败，请检查网络和后端: ' + e.message);
      }
    }

    async function openArtifact(type, label) {
      document.getElementById('modal-title').textContent = `${ARTIFACT_LABELS[type]?.icon || '📄'} ${label}`;
      document.getElementById('modal-content').innerHTML = '<p class="text-slate-500 text-center py-8">加载中...</p>';
      document.getElementById('artifact-modal').classList.remove('hidden');

      try {
        const res = await fetch(`${API}/api/artifact/${type}`);
        const data = await res.json();
        const html = marked.parse(data.content || '（内容为空）');
        document.getElementById('modal-content').innerHTML = html;

        // 绑定复制按钮事件
        const copyBtn = document.getElementById('modal-copy-btn');
        copyBtn.onclick = () => copyArtifact(type, copyBtn);
      } catch (e) {
        document.getElementById('modal-content').innerHTML = '<p class="text-red-400 text-center py-8">加载失败</p>';
      }
    }

    async function copyArtifact(type, btn) {
      const textSpan = btn.querySelector('.btn-text') || btn;
      const original = textSpan.textContent;
      textSpan.textContent = '复制成功';
      const iconSpan = btn.querySelector('span:first-child');
      if (iconSpan) iconSpan.textContent = '✅';

      try {
        const res = await fetch(`${API}/api/artifact/${type}`);
        const data = await res.json();
        await navigator.clipboard.writeText(data.content || '');
        setTimeout(() => {
          textSpan.textContent = original;
          if (iconSpan) iconSpan.textContent = '📋';
        }, 1500);
      } catch (e) {
        textSpan.textContent = '复制失败';
        if (iconSpan) iconSpan.textContent = '❌';
        setTimeout(() => {
          textSpan.textContent = original;
          if (iconSpan) iconSpan.textContent = '📋';
        }, 1500);
      }
    }

    function closeModal() {
      document.getElementById('artifact-modal').classList.add('hidden');
    }

    document.getElementById('artifact-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('artifact-modal')) closeModal();
    });

    async function loadAndShowTraces() {
      document.getElementById('traces-modal').classList.remove('hidden');
      const container = document.getElementById('traces-modal-content');
      container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">加载中...</p>';

      try {
        const res = await fetch(`${API}/api/traces`);
        const data = await res.json();

        if (!data.traces || data.traces.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">暂无追踪数据</p>';
          return;
        }

        const eventColors = {
          llm_call_round_0: 'text-blue-400', llm_response_round_0: 'text-green-400',
          reflection: 'text-yellow-400', llm_call_round_1: 'text-blue-300',
          llm_response_round_1: 'text-green-300',
        };

        container.innerHTML = data.traces.map(t => {
          const color = eventColors[t.event] || 'text-slate-400';
          const time = t.time ? new Date(t.time).toLocaleTimeString('zh-CN') : '';
          return `<div class="flex gap-3 text-xs py-1.5 border-b border-white/5">
        <span class="text-slate-600 flex-shrink-0 w-16">${time}</span>
        <span class="font-medium text-slate-300 flex-shrink-0 w-20 truncate">${t.agent}</span>
        <span class="${color} flex-shrink-0 w-32 truncate">${t.event}</span>
        ${t.tokens ? `<span class="text-slate-500 flex-shrink-0">${t.tokens}tok</span>` : '<span class="w-12"></span>'}
        ${t.duration_ms ? `<span class="text-slate-600 flex-shrink-0">${t.duration_ms}ms</span>` : ''}
        <span class="text-slate-600 truncate flex-1">${t.content?.substring(0, 80) || ''}</span>
      </div>`;
        }).join('');
      } catch (e) {
        container.innerHTML = '<p class="text-red-400 text-center py-4">加载失败</p>';
      }
    }

    function closeTracesModal() {
      document.getElementById('traces-modal').classList.add('hidden');
    }

    // 点击外部关闭模态框
    // 入口 modal 仅通过关闭按钮关闭，不响应点击外部

    document.getElementById('traces-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('traces-modal')) closeTracesModal();
    });

    window.availableModels = [];

    // 预设的 OpenRouter 模型列表
    const OPENROUTER_MODELS = [
      { value: 'deepseek/deepseek-v3.2', label: 'DeepSeek V3.2' },
      { value: 'deepseek/deepseek-r1', label: 'DeepSeek R1' },
      { value: 'openai/gpt-5.4-chat', label: 'OpenAI GPT-5.4' },
      { value: 'google/gemini-3.1-flash-lite-preview', label: 'Google Gemini Flash' },
      { value: 'anthropic/claude-opus-4.6', label: 'Anthropic Claude Opus 4.6' },
      { value: 'qwen/qwen3.5-flash-02-23', label: 'Qwen 3.5 Flash' },
    ];

    async function fetchAndStoreModels() {
      // 默认先加载 OpenRouter 模型
      window.availableModels = [...OPENROUTER_MODELS];

      try {
        const res = await fetch(`${API}/api/cherry/models`);
        const data = await res.json();
        if (data.models && data.models.length > 0) {
          // Cherry Studio 不支持 openrouter: 前缀的模型，需要过滤掉
          const cherryModels = data.models.filter(m => !m.value.startsWith('openrouter:'));

          // 如果 Cherry Studio 有模型，标记一下来源以示区分并增加 cherry/ 前缀
          const formattedCherryModels = cherryModels.map(m => ({
            value: `cherry/${m.value}`,
            label: `[本地 Cherry] ${m.label}`
          }));

          window.availableModels = [...window.availableModels, ...formattedCherryModels];
        }
      } catch (e) {
        console.error('获取 Cherry 引擎模型失败:', e);
      }
    }

    // 事件委托处理项目卡片点击和删除按钮（放在所有函数定义之后）
    document.addEventListener('click', function(e) {
      // 检查是否是删除按钮
      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn) {
        console.log('[DEBUG] 删除按钮被点击', deleteBtn);
        e.preventDefault();
        e.stopPropagation();
        const projectId = deleteBtn.getAttribute('data-delete-id');
        console.log('[DEBUG] projectId:', projectId, 'deleteProject 函数:', typeof deleteProject);
        if (projectId) {
          deleteProject(projectId);
        }
        return;
      }

      // 检查是否是项目卡片（用于跳转）
      const card = e.target.closest('.project-card');
      if (card) {
        const projectId = card.getAttribute('data-project-id');
        if (projectId) {
          window.location.href = 'editor.html?project_id=' + projectId;
        }
      }
    });

    // 页面加载时并行拉取列表和订阅事件
    window.addEventListener('load', () => {
      // 并行执行，提高加载速度
      fetchAndStoreModels();
      fetchAndRenderProjects();
      connectSSE();
    });
  </script>
</body>

</html>
