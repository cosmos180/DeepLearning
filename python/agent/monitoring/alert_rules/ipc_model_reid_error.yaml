name: IPC 模型调用失败-reid
description: 监控 Reid 模型调用失败情况
index: tupu-metrics-production-tp_ipc-*
query: '(metrics.platform: "$platform") AND (metrics.msg: "detect reid timeout")'
time_window:
  range: now-15m
alert:
  field: _count
  threshold: 10
  threshold_type: greater_than
  aggregation_field: deviceId.keyword
severity: critical
