name: IPC 数据积压告警-JSON缓存
description: 监控 JSON 缓存数据积压情况
index: tupu-metrics-production-tp_ipc-*
query: '(metrics.platform: "$platform") AND (metrics.cache_info.json: > 1000)'
time_window:
  range: now-30m
alert:
  field: metrics.cache_info.json
  threshold: 1000
  threshold_type: greater_than
  aggregation_field: deviceId.keyword
severity: warning
