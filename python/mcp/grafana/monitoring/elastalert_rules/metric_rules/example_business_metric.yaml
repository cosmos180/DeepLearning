# 示例规则：业务指标告警
# Example Rule: Business Metric Alert

# 规则名称
name: Business Failure Rate Alert

# 规则类型：frequency
type: frequency

# Elasticsearch 索引模式
index: metrics-*

# 触发阈值
num_events: 50

# 时间窗口：5 分钟内失败 50 次
timeframe:
  minutes: 5

# 查询条件 - 业务失败事件
filter:
- query:
    query_string:
        query: 'type:business_event AND event.status:failure AND event.type:order_processing'

# 告警方式
alert:
  - email

# 邮件接收者
email:
  - "business-team@example.com"
  - "ops-team@example.com"

# 邮件主题
alert_subject: "🔴 [CRITICAL] 业务异常 - 订单处理失败率过高"

# 邮件内容
alert_text_type: alert_text_jinja
alert_text: |
  <h2>🔴 业务异常告警</h2>
  <p>检测到业务处理失败率异常！</p>

  <h3>告警摘要</h3>
  <table border="1" cellpadding="5" style="border-collapse: collapse; background: #ffebee;">
      <tr><th>事件类型</th><td>订单处理 (order_processing)</td></tr>
      <tr><th>失败数量</th><td style="color: red; font-weight: bold; font-size: 18px;">{{ num_hits }}</td></tr>
      <tr><th>时间窗口</th><td>5 分钟</td></tr>
      <tr><th>阈值</th><td>50 次</td></tr>
      <tr><th>触发时间</th><td>{{ alert_time }}</td></tr>
  </table>

  <h3>失败事件详情（前 10 条）</h3>
  {% for hit in hits[:10] %}
  <div style="background: #f5f5f5; padding: 10px; margin: 5px 0; border-left: 3px solid #f44336;">
      <p><strong>时间:</strong> {{ hit._source.get('@timestamp', 'N/A') }}</p>
      <p><strong>订单 ID:</strong> {{ hit._source.get('event.order_id', 'N/A') }}</p>
      <p><strong>错误码:</strong> {{ hit._source.get('event.error_code', 'N/A') }}</p>
      <p><strong>错误消息:</strong> {{ hit._source.get('event.error_message', 'N/A') }}</p>
  </div>
  {% endfor %}

  <h3>影响分析</h3>
  <p>高失败率可能导致：</p>
  <ul>
      <li>用户体验下降</li>
      <li>订单流失</li>
      <li>客户投诉增加</li>
  </ul>

  <h3>建议操作</h3>
  <ol>
      <li>立即检查订单处理服务状态</li>
      <li>检查数据库连接和性能</li>
      <li>查看下游依赖服务（支付网关等）</li>
      <li>必要时切换到备用服务</li>
  </ol>

# 包含字段
include:
  - event.type
  - event.status
  - event.order_id
  - event.error_code
  - event.error_message
  - service_name
  - "@timestamp"

# 告警时间限制
alert_time_limit:
  hours: 4

# 重复告警间隔
realert:
  minutes: 10
