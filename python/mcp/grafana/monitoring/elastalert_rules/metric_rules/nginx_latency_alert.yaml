# Nginx 网关延迟告警
# Nginx Gateway Latency Alert

# 规则名称
name: Nginx Gateway Latency Alert

# 规则类型：frequency
type: frequency

# Elasticsearch 索引模式
index: tupu-metrics-production-gateway_nginx-*

# 触发阈值：5 分钟内有 50 次慢请求
num_events: 50

# 时间窗口：5 分钟
timeframe:
  minutes: 5

# 查询条件 - 平均响应时间超过 1 秒
filter:
- range:
    metrics.value.avg_dur:
        gte: 1.0

# 告警方式
alert:
  - debug
  # - email

# 邮件主题
alert_subject: "⚠️ [ALERT] Nginx 网关延迟过高 - {{ num_hits }} 次慢请求"

# 邮件内容
alert_text_type: alert_text_jinja
alert_text: |
  <h2>⚠️ Nginx 网关延迟告警</h2>
  <p>检测到 Nginx 网关响应时间异常！</p>

  <h3>告警摘要</h3>
  <ul>
      <li><strong>慢请求数量:</strong> {{ num_hits }}</li>
      <li><strong>时间窗口:</strong> 5 分钟</li>
      <li><strong>响应时间阈值:</strong> ≥ 1.0 秒</li>
  </ul>

  <h3>慢请求详情（前 10 条）</h3>
  <table border="1" cellpadding="5" style="border-collapse: collapse;">
      <tr>
          <th>时间</th>
          <th>URL</th>
          <th>平均响应时间</th>
          <th>最大响应时间</th>
          <th>请求数</th>
          <th>状态码</th>
      </tr>
  {% for hit in hits[:10] %}
      <tr>
          <td>{{ hit._source.get('@timestamp', 'N/A') }}</td>
          <td>{{ hit._source.metrics.value.get('url', 'N/A') }}</td>
          <td style="color: red;">{{ hit._source.metrics.value.get('avg_dur', 0)|round(3) }}s</td>
          <td>{{ hit._source.metrics.value.get('max_dur', 0)|round(3) }}s</td>
          <td>{{ hit._source.metrics.value.get('req_count', 0) }}</td>
          <td>{{ hit._source.metrics.value.get('h_code', 'N/A') }}</td>
      </tr>
  {% endfor %}
  </table>

# 包含字段
include:
  - metrics.value.avg_dur
  - metrics.value.max_dur
  - metrics.value.url
  - metrics.value.req_count
  - metrics.value.h_code
  - "@timestamp"

# 重复告警间隔
realert:
  minutes: 15

# 告警聚合
aggregation:
  minutes: 5
