# 示例规则：错误数量激增告警
# Example Rule: Error Spike Detection Alert

# 规则名称
name: Error Spike Detection Alert

# 规则类型：spike - 检测短时间内事件数量激增
type: spike

# Elasticsearch 索引模式
index: logs-*

# 查询条件 - 匹配错误级别的日志
filter:
- query:
    query_string:
        query: 'level:ERROR OR level:error'

# 用于分组的关键字段 - 按服务名和错误类型分组统计
es_query_key: ["service_name", "error_type"]

# 参考窗口内的参考阈值
threshold_ref: 10

# 当前窗口内的阈值
threshold_cur: 50

# 激增倍数 - 当前值超过参考值的 5 倍时告警
spike_height: 5

# 激增方向：up=增长, down=下降, both=双向
spike_type: up

# 时间窗口
timeframe:
  minutes: 5

# 同一告警的重复发送间隔
realert:
  minutes: 30

# 告警聚合时间 - 将这段时间内的告警合并为一封邮件
aggregation:
  minutes: 5

# 告警方式
alert:
  - debug
  - email

# 邮件接收者
email:
  - "ops-team@example.com"

# 邮件主题（支持变量）
alert_subject: "🚨 [ALERT] Error spike detected in {0}"
alert_subject_args:
  - service_name

# 邮件内容类型
alert_text_type: alert_text_jinja

# 邮件内容模板
alert_text: |
  <h2>错误激增告警</h2>
  <p>检测到短时间内错误数量异常增长！</p>

  <h3>告警详情</h3>
  <ul>
    <li><strong>服务名称:</strong> {{ service_name }}</li>
    <li><strong>错误类型:</strong> {{ error_type }}</li>
    <li><strong>当前数量:</strong> {{ num_hits }} (最近 5 分钟)</li>
    <li><strong>参考数量:</strong> {{ threshold_ref }} (之前 5 分钟)</li>
    <li><strong>激增倍数:</strong> {{ spike_height }}x</li>
  </ul>

  <h3>最近的错误样例（前 5 条）:</h3>
  {% for hit in hits[:5] %}
  <hr>
  <p><strong>时间:</strong> {{ hit._source.get('@timestamp', 'N/A') }}</p>
  <p><strong>消息:</strong> {{ hit._source.get('message', 'N/A') }}</p>
  {% if hit._source.get('stack_trace') %}
  <p><strong>堆栈:</strong></p>
  <pre>{{ hit._source.stack_trace }}</pre>
  {% endif %}
  {% endfor %}

  <p><a href="{{ kibana_url }}">在 Kibana 中查看完整日志 →</a></p>

# 包含在告警中的字段
include:
  - service_name
  - error_type
  - message
  - hostname
  - "@timestamp"
  - level

# Kibana URL（需要在 elastalert.yaml 中配置）
alert_text_args:
  - service_name
  - error_type
  - num_hits
  - threshold_ref
  - spike_height
  - kibana_url
