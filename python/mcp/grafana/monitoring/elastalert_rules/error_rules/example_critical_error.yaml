# 示例规则：严重错误模式告警
# Example Rule: Critical Error Pattern Alert

# 规则名称
name: Critical Error Pattern Alert

# 规则类型：frequency - 在指定时间内事件数量达到阈值
type: frequency

# Elasticsearch 索引模式
index: logs-*

# 触发阈值：1 次（严重错误出现即告警）
num_events: 1

# 时间窗口：1 分钟内
timeframe:
  minutes: 1

# 查询条件 - 匹配严重错误模式
filter:
- query:
    query_string:
        query: 'level:ERROR AND (message:"NullPointerException" OR message:"OutOfMemoryError" OR message:"Connection refused" OR message:"TimeoutException")'

# 告警方式
alert:
  - email

# 邮件接收者
email:
  - "oncall@example.com"
  - "ops-team@example.com"

# 邮件主题
alert_subject: "🔴 [CRITICAL] 严重错误告警 - 生产环境检测到关键异常"

# 邮件内容
alert_text_type: alert_text_jinja
alert_text: |
  <!DOCTYPE html>
  <html>
  <head>
      <style>
          body { font-family: Arial, sans-serif; }
          .critical { color: #d32f2f; font-weight: bold; }
          .error-box { background: #ffebee; padding: 15px; border-left: 4px solid #f44336; margin: 10px 0; }
      </style>
  </head>
  <body>
      <h1 class="critical">🔴 严重错误告警</h1>
      <p>生产环境检测到关键异常，请立即处理！</p>

      <h2>告警详情</h2>
      <table border="1" cellpadding="5" style="border-collapse: collapse;">
          <tr><th>规则名称</th><td>{{ rule_name }}</td></tr>
          <tr><th>触发时间</th><td>{{ alert_time }}</td></tr>
          <tr><th>匹配数量</th><td>{{ num_hits }}</td></tr>
      </table>

      <h2>错误详情</h2>
      {% for hit in hits[:5] %}
      <div class="error-box">
          <p><strong>时间:</strong> {{ hit._source.get('@timestamp', 'N/A') }}</p>
          <p><strong>服务:</strong> {{ hit._source.get('service_name', 'N/A') }}</p>
          <p><strong>主机:</strong> {{ hit._source.get('hostname', 'N/A') }}</p>
          <p><strong>错误消息:</strong> {{ hit._source.get('message', 'N/A') }}</p>
          {% if hit._source.get('stack_trace') %}
          <p><strong>堆栈跟踪:</strong></p>
          <pre style="background: #f5f5f5; padding: 10px;">{{ hit._source.stack_trace }}</pre>
          {% endif %}
          {% if hit._source.get('request_id') %}
          <p><strong>请求 ID:</strong> {{ hit._source.request_id }}</p>
          {% endif %}
      </div>
      {% endfor %}

      <h2>建议操作</h2>
      <ol>
          <li>立即登录服务器检查服务状态</li>
          <li>查看 Kibana 获取完整错误上下文</li>
          <li>检查相关系统依赖（数据库、缓存等）</li>
          <li>必要时进行服务重启或回滚</li>
      </ol>

      <p><strong>相关链接:</strong> <a href="{{ kibana_url }}">Kibana</a></p>
  </body>
  </html>

# 包含字段
include:
  - service_name
  - hostname
  - message
  - level
  - stack_trace
  - request_id
  - "@timestamp"

# 告警时间限制
alert_time_limit:
  hours: 24
