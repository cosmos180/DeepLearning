# SMTP 邮件服务器认证配置
# SMTP Email Server Authentication Configuration

# 邮件服务器认证信息
user: your-email@example.com
password: your-app-password

# 注意：
# 1. 使用 Gmail 时需要使用应用专用密码，而非普通密码
#    生成地址：https://myaccount.google.com/apppasswords
#
# 2. 使用 QQ 邮箱时需要开启 SMTP 服务并使用授权码
#    设置路径：设置 -> 账户 -> POP3/IMAP/SMTP/Exchange/CardDAV/CalDAV服务
#
# 3. 使用企业邮箱时，请联系管理员获取 SMTP 配置信息

# 邮件服务器配置示例：
#
# Gmail:
#   smtp_host: smtp.gmail.com
#   smtp_port: 587
#   smtp_ssl: true
#
# QQ Mail:
#   smtp_host: smtp.qq.com
#   smtp_port: 587
#   smtp_ssl: true
#
# 163 Mail:
#   smtp_host: smtp.163.com
#   smtp_port: 465
#   smtp_ssl: true
#
# 企业邮箱 (以腾讯企业邮为例):
#   smtp_host: smtp.exmail.qq.com
#   smtp_port: 465
#   smtp_ssl: true
